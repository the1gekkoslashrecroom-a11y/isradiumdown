<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yes, Radium is down</title>
  <style>
    :root {
      --bg: #050505;
      --panel: #f2f2f2;
      --green: #19e75d;
      --green-2: #11cb50;
      --green-3: #0ea748;
      --text: #0b0b0b;
      --muted: #4b4b4b;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: white;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at top, rgba(25, 231, 93, 0.12), transparent 30%),
        linear-gradient(180deg, #030303 0%, #0d0d0d 100%);
      overflow: hidden;
    }

    .hero {
      position: absolute;
      left: 40px;
      right: 40px;
      top: 70px;
      bottom: 120px;
      background: var(--panel);
      color: var(--text);
      border-radius: 52px;
      border: 10px solid var(--green);
      box-shadow: 0 18px 0 var(--shadow);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.14), rgba(255,255,255,0));
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
      flex-wrap: wrap;
    }

    .mark {
      position: relative;
      width: clamp(170px, 20vw, 340px);
      height: clamp(170px, 20vw, 340px);
      flex-shrink: 0;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 8px 0 rgba(0,0,0,0.08));
    }

    .mark-core {
      position: absolute;
      width: 72%;
      height: 72%;
      background: var(--green);
      border-radius: 26px;
      transform: rotate(45deg);
      box-shadow: inset 0 0 0 14px rgba(255,255,255,0.06);
    }

    .mark-core::before {
      content: "";
      position: absolute;
      inset: 18%;
      background: var(--panel);
      border-radius: 18px;
      box-shadow: inset 0 0 0 12px var(--green);
    }

    .mark-core::after {
      content: "";
      position: absolute;
      width: 48%;
      height: 48%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      background: var(--green);
      border-radius: 14px;
      box-shadow:
        0 0 0 12px rgba(0,0,0,0.12),
        0 0 0 22px var(--panel);
    }

    .mark-cut {
      position: absolute;
      width: 80%;
      height: 80%;
      left: 14%;
      top: 14%;
      border-left: 18px solid var(--green);
      border-top: 18px solid var(--green);
      border-radius: 20px 0 0 28px;
      transform: skewY(-12deg);
      opacity: 0.96;
    }

    .title {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      white-space: nowrap;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      letter-spacing: -0.08em;
      line-height: 0.74;
      color: var(--green);
      text-transform: uppercase;
      text-shadow: 0 7px 0 rgba(19, 124, 58, 0.18);
      flex-wrap: wrap;
    }

    .title .small {
      font-size: clamp(28px, 3vw, 72px);
      margin-bottom: 18px;
    }

    .title .large {
      font-size: clamp(100px, 12vw, 420px);
    }

    .status {
      width: min(740px, 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(25, 231, 93, 0.08);
      border: 2px solid rgba(25, 231, 93, 0.5);
      border-radius: 999px;
      padding: 14px 20px;
      color: #0e0e0e;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 13px;
      box-shadow: inset 0 0 18px rgba(25, 231, 93, 0.06);
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px rgba(25, 231, 93, 0.9);
    }

    .sub {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(14px, 1.3vw, 18px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(11, 11, 11, 0.72);
    }

    .floating-logo {
      position: fixed;
      left: 30px;
      bottom: 28px;
      width: 180px;
      height: 120px;
      pointer-events: none;
      z-index: 20;
      animation: floatLogo 4.2s ease-in-out infinite alternate;
    }

    .floating-logo .box {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--green);
      border-radius: 18px;
      transform: rotate(-4deg);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 8px rgba(255,255,255,0.06);
    }

    .floating-logo .box::before {
      content: "";
      position: absolute;
      inset: 18px 16px 18px 14px;
      background: var(--panel);
      border-radius: 12px;
      box-shadow: inset 0 0 0 8px var(--green);
    }

    .floating-logo .box::after {
      content: "I";
      position: absolute;
      font-size: 54px;
      font-weight: 900;
      color: var(--green);
      transform: rotate(45deg);
    }

    .floating-logo .cut {
      position: absolute;
      inset: 18px 16px 14px 12px;
      border-left: 10px solid var(--green);
      border-top: 10px solid var(--green);
      border-radius: 12px 0 0 16px;
      transform: skewY(-12deg);
    }

    @keyframes floatLogo {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(10px, -12px, 0); }
    }

    @media (max-width: 780px) {
      .hero {
        left: 18px;
        right: 18px;
        top: 30px;
        bottom: 70px;
        border-radius: 30px;
        border-width: 8px;
      }

      .logo-row {
        flex-direction: column;
        gap: 12px;
      }

      .title {
        gap: 6px;
      }

      .title .small {
        margin-bottom: 8px;
      }

      .status {
        letter-spacing: 0.08em;
        font-size: 11px;
      }

      .floating-logo {
        width: 130px;
        height: 82px;
        left: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="content">
        <div class="logo-row">
          <div class="mark" aria-label="Radium logo">
            <div class="mark-core"></div>
            <div class="mark-cut"></div>
          </div>

          <div class="title" aria-label="Yes Radium is down">
            <span class="small">Yes,</span>
            <span class="large">Radium</span>
            <span class="small">Is Down</span>
          </div>
        </div>

        <div class="status">
          <span class="status-dot"></span>
          <span>Service unavailable</span>
        </div>

        <div class="sub">We are investigating the outage.</div>
      </div>
    </div>
  </div>

  <div class="floating-logo" aria-hidden="true">
    <div class="box">
      <div class="cut"></div>
    </div>
  </div>
</body>
</html>
